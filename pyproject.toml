[project]
name = "sahmk-mcp"
version = "0.8.0"
description = "Official SAHMK MCP server for Saudi market data in AI agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sahmk" }]
keywords = ["mcp", "sahmk", "saudi-market", "stocks", "market-data", "ai-agents"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "sahmk>=0.15.0",
    "fastmcp>=2.0.0",
]

[project.scripts]
sahmk-mcp = "sahmk_mcp.server:main"

[project.urls]
Homepage = "https://sahmk.sa/developers"
Repository = "https://github.com/sahmk-sa/sahmk-mcp"
Issues = "https://github.com/sahmk-sa/sahmk-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
